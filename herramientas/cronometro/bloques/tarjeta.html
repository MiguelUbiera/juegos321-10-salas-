<!DOCTYPE html>
<html lang="es">
<!-- Secuencia321 · Minutos en bloques · la tarjeta compacta · v1.0
     Producto: sale de fuente/tarjeta.html, fuente/tarjeta.css y ficha.json
     con construir.py. No se retoca a mano. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minutos en bloques · tarjeta</title>
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&amp;family=Nunito:wght@400;600;700;800&amp;family=Source+Code+Pro:wght@400;600;700&amp;display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Secuencia321 · Cronómetro de actividad · la tarjeta compacta
   Lo que el panel de cronómetros coloca en su carrusel: el ícono grande,
   el nombre y las claves. Sin explicaciones: la explicación vive dentro de
   la herramienta, en su panel de información.
   Una carta, no una página: todo se mide en `em` sobre --carta, así el
   panel la agranda o la achica con una sola variable (la del frente, más
   grande; las del fondo, más pequeñas) sin retocar nada más.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --su-fondo:#f7f1e9; --su-papel:#fffcf7; --su-linea:#e2d6c4; --su-calido:#e4c5b5;
  --ti-fuerte:#1b1512; --ti-media:#2e2622; --ti-tenue:#4a3f38;
  --te-hondo:#8f3a1e; --te-base:#b04a2a; --te-velo:#f0dccf;
  --pe-hondo:#0f2d3a; --pe-base:#173f50; --pe-claro:#2c5c70; --pe-velo:#eaf0f2;
  --fam-titulo:'Lora', Georgia, 'Times New Roman', serif;
  --fam-cuerpo:'Nunito', 'Segoe UI', system-ui, sans-serif;
  --fam-num:'Source Code Pro', Consolas, monospace;
  --carta:16px;                 /* el panel mueve esta sola medida */
  --sal:cubic-bezier(.22,.8,.25,1);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:var(--fam-cuerpo);font-weight:600;line-height:1.45;color:var(--ti-fuerte);
  background:var(--pe-base);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid #e08a5f;outline-offset:2px}

/* ── La carta ──────────────────────────────────────────────────────────── */
.carta{position:relative;display:flex;flex-direction:column;
  width:21em;font-size:var(--carta);
  padding:1.75em 1.5em 1.5em;
  background:var(--su-papel);border:1px solid var(--su-linea);border-radius:1.75em;
  box-shadow:0 .75em 2em rgba(6,26,34,.34),0 .125em .375em rgba(6,26,34,.22);
  text-align:center;isolation:isolate}
/* el velo terracota de arriba ata la carta a la marca sin pintarla entera */
.carta::before{content:"";position:absolute;inset:0 0 auto;height:7.25em;z-index:-1;
  border-radius:1.75em 1.75em 2em 2em;
  background:linear-gradient(var(--te-velo),rgba(240,220,207,0))}

.c-icono{display:block;width:5.5em;aspect-ratio:1;margin:0 auto .9em;border-radius:28%;
  box-shadow:0 .375em 1em rgba(15,45,58,.26),0 .0625em .125em rgba(15,45,58,.22)}
.c-icono svg{display:block;width:100%;height:100%}

.c-ante{margin:0 0 .25em;font-family:var(--fam-num);font-weight:600;font-size:.7em;
  letter-spacing:.16em;text-transform:uppercase;color:var(--te-hondo)}
.c-nombre{margin:0;font-family:var(--fam-titulo);font-weight:700;font-size:1.55em;line-height:1.18;
  color:var(--pe-hondo);text-wrap:balance}
.c-lema{margin:.5em 0 0;font-size:.92em;line-height:1.4;color:var(--ti-tenue);text-wrap:balance}

.c-claves{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em;
  margin:1.15em 0 0;padding:0;list-style:none}
.c-claves li{padding:.3em .7em;border-radius:999px;background:var(--pe-velo);
  font-size:.78em;font-weight:800;color:var(--pe-claro);white-space:nowrap}

.c-abrir{display:flex;align-items:center;justify-content:center;gap:.5em;
  margin-top:1.3em;min-height:3em;padding:0 1.25em;border:0;border-radius:999px;
  background:var(--te-base);color:#fffaf4;font-family:inherit;font-weight:800;font-size:1em;
  text-decoration:none;cursor:pointer;
  box-shadow:0 .375em .875em rgba(143,58,30,.28);
  transition:background .18s var(--sal),transform .18s var(--sal)}
.c-abrir:hover{background:var(--te-hondo)}
.c-abrir:active{transform:translateY(1px)}
.c-abrir svg{width:1.05em;height:1.05em;fill:currentColor}

/* ── En el carrusel en órbita ───────────────────────────────────────────
   El panel pone varias a la vez: una al frente y las demás girando por
   detrás, más pequeñas y translúcidas. Para eso la carta necesita dos
   cosas y nada más: escalar entera con `--carta` y saber recogerse.
   Una carta del fondo se lee de lejos con el ícono y el nombre; las
   claves y el botón sobran ahí y solo hacen ruido. */
.carta[data-fondo="si"]{pointer-events:none;user-select:none}
.carta[data-fondo="si"] .c-abrir,
.carta[data-fondo="si"] .c-claves,
.carta[data-fondo="si"] .c-lema{display:none}
.carta[data-fondo="si"]{padding-bottom:2em}
/* el panel puede atenuarlas con una variable, sin tocar el CSS de aquí */
.carta{opacity:var(--fondo-velo,1)}
/* y girarlas: el `transform` lo pone el panel; aquí solo se prepara el
   terreno para que el giro no se vea plano ni pixelado */
.carta{transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}

@media (prefers-reduced-motion:reduce){.c-abrir{transition:none}}
@media (max-width:400px){:root{--carta:14px}}
</style>
</head>
<body>
<!-- La carta que el panel coloca en su carrusel.
     Aquí va sola y quieta, a su tamaño natural, para poder mirarla y
     medirla. El panel pone varias a la vez y las mueve: para las del
     fondo, basta bajarles --carta y marcarlas data-fondo="si". -->
<article class="carta" data-s321="tarjeta" data-cronometro="bloques">
  <span class="c-icono" aria-hidden="true"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="bl-fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d677e"/><stop offset="1" stop-color="#143847"/></linearGradient><linearGradient id="bl-brillo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".52" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="bl-ultimo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c85f3c"/><stop offset="1" stop-color="#b04a2a"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#bl-fondo)"/><rect width="64" height="64" rx="18" fill="url(#bl-brillo)"/><g stroke="#f7f1e9" stroke-width="1.6" stroke-linecap="round" opacity=".55"><path d="M25.50 16.10L25.50 14.10"/><path d="M30.95 17.56L31.95 15.83"/><path d="M34.94 21.55L36.67 20.55"/><path d="M36.40 27.00L38.40 27.00"/><path d="M34.94 32.45L36.67 33.45"/><path d="M30.95 36.44L31.95 38.17"/><path d="M25.50 37.90L25.50 39.90"/><path d="M20.05 36.44L19.05 38.17"/><path d="M16.06 32.45L14.33 33.45"/><path d="M14.60 27.00L12.60 27.00"/><path d="M16.06 21.55L14.33 20.55"/><path d="M20.05 17.56L19.05 15.83"/></g><path d="M25.5 14.5a12.5 12.5 0 0 1 10.7 19" fill="none" stroke="#e08a5f" stroke-width="2.8" stroke-linecap="round"/><rect x="35.5" y="35" width="10.4" height="10.4" rx="3" fill="#f7f1e9" opacity=".34"/><rect x="24.6" y="39.2" width="10.8" height="10.8" rx="3" fill="url(#bl-ultimo)"/></svg></span>
  <p class="c-ante">El tiempo que se ve crecer</p>
  <h1 class="c-nombre">Minutos en bloques</h1>
  <p class="c-lema">Cada minuto que pasa se convierte en un bloque que se queda ahí.</p>
  <ul class="c-claves"><li>Duración de bloque configurable</li><li>Meta en bloques</li><li>Agrupar de 5 o de 10</li></ul>
  <a class="c-abrir" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.3v13.4a1.2 1.2 0 0 0 1.8 1l10.4-6.7a1.2 1.2 0 0 0 0-2L9.8 4.3A1.2 1.2 0 0 0 8 5.3z"/></svg>
    Abrir el cronómetro
  </a>
</article>
</body>
</html>
