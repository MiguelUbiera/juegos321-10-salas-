<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Minutos en bloques">
  <!-- Secuencia321 · Cronómetro 4 · Minutos en bloques · ícono de aplicación
       De la misma casa que Actividad y Etapas: el cuadrado con su radio, el
       fondo petróleo y el brillo. El dibujo es la rueda llenándose —doce
       marcas y un arco en terracota— y, cayendo de ella, dos bloques: la
       misma relación de la herramienta, en miniatura. -->
  <defs>
    <linearGradient id="bl-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d677e"/>
      <stop offset="1" stop-color="#143847"/>
    </linearGradient>
    <linearGradient id="bl-brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bl-ultimo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c85f3c"/>
      <stop offset="1" stop-color="#b04a2a"/>
    </linearGradient>
  </defs>
  <!-- cuadrado de aplicación: radio 18/64 ≈ 28 % del lado, como los hermanos -->
  <rect width="64" height="64" rx="18" fill="url(#bl-fondo)"/>
  <rect width="64" height="64" rx="18" fill="url(#bl-brillo)"/>
  <!-- la rueda: doce marcas parejas, y un arco que se llena en terracota -->
  <g stroke="#f7f1e9" stroke-width="1.6" stroke-linecap="round" opacity=".55">
    <path d="M25.50 16.10L25.50 14.10"/>
    <path d="M30.95 17.56L31.95 15.83"/>
    <path d="M34.94 21.55L36.67 20.55"/>
    <path d="M36.40 27.00L38.40 27.00"/>
    <path d="M34.94 32.45L36.67 33.45"/>
    <path d="M30.95 36.44L31.95 38.17"/>
    <path d="M25.50 37.90L25.50 39.90"/>
    <path d="M20.05 36.44L19.05 38.17"/>
    <path d="M16.06 32.45L14.33 33.45"/>
    <path d="M14.60 27.00L12.60 27.00"/>
    <path d="M16.06 21.55L14.33 20.55"/>
    <path d="M20.05 17.56L19.05 15.83"/>
  </g>
  <path d="M25.5 14.5a12.5 12.5 0 0 1 10.7 19" fill="none" stroke="#e08a5f" stroke-width="2.8" stroke-linecap="round"/>
  <!-- lo que ya cayó: dos bloques, el último en terracota -->
  <rect x="35.5" y="35" width="10.4" height="10.4" rx="3" fill="#f7f1e9" opacity=".34"/>
  <rect x="24.6" y="39.2" width="10.8" height="10.8" rx="3" fill="url(#bl-ultimo)"/>
</svg>
