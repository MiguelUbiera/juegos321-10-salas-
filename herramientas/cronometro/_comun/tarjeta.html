<!-- La carta que el panel coloca en su carrusel.
     Aquí va sola y quieta, a su tamaño natural, para poder mirarla y
     medirla. El panel pone varias a la vez y las mueve: para las del
     fondo, basta bajarles --carta y marcarlas data-fondo="si". -->
<article class="carta" data-s321="tarjeta" data-cronometro="@@ID@@">
  <span class="c-icono" aria-hidden="true"><!-- ICONO --></span>
  <p class="c-ante">@@ANTETITULO@@</p>
  <h1 class="c-nombre">@@NOMBRE@@</h1>
  <p class="c-lema">@@LEMA@@</p>
  <ul class="c-claves">@@CLAVES@@</ul>
  <a class="c-abrir" href="@@ABRIR@@">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.3v13.4a1.2 1.2 0 0 0 1.8 1l10.4-6.7a1.2 1.2 0 0 0 0-2L9.8 4.3A1.2 1.2 0 0 0 8 5.3z"/></svg>
    Abrir el cronómetro
  </a>
</article>
