<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cronómetro de actividad">
  <!-- Secuencia321 · Cronómetro de actividad · ícono de aplicación -->
  <defs>
    <linearGradient id="ca-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d677e"/>
      <stop offset="1" stop-color="#143847"/>
    </linearGradient>
    <linearGradient id="ca-brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- cuadrado de aplicación: radio 18/64 ≈ 28 % del lado -->
  <rect width="64" height="64" rx="18" fill="url(#ca-fondo)"/>
  <rect width="64" height="64" rx="18" fill="url(#ca-brillo)"/>
  <!-- corona y botón lateral -->
  <rect x="27" y="7.6" width="10" height="5" rx="2.5" fill="#f7f1e9"/>
  <rect x="30.4" y="11.8" width="3.2" height="4.4" fill="#f7f1e9"/>
  <path d="M46.3 21.1 49.3 18.1" stroke="#e4c5b5" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <!-- carátula crema -->
  <circle cx="32" cy="35.4" r="18.4" fill="#f7f1e9"/>
  <!-- arco terracota clara: lo que va de la meta -->
  <path d="M32 20.6 A14.8 14.8 0 0 1 44.82 28" stroke="#e08a5f" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- cuatro marcas petróleo -->
  <path d="M32 22.3v2.7M45.1 35.4h-2.7M32 48.5v-2.7M18.9 35.4h2.7" stroke="#173f50" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <!-- aguja terracota, al final del arco -->
  <path d="M32 35.4 41.1 30.15" stroke="#b04a2a" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="35.4" r="3.3" fill="#173f50"/>
</svg>
