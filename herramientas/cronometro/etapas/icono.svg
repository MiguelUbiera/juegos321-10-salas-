<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cronómetro por etapas">
  <!-- Secuencia321 · Cronómetro por etapas · ícono de aplicación
       De la misma casa que el de actividad: el cuadrado con su radio, el
       fondo petróleo y el brillo. Cambia el dibujo, que aquí no es un reloj
       sino el reparto: tres tramos de distinto tamaño, con sus colores, y
       la marca de por dónde va. -->
  <defs>
    <linearGradient id="ce-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d677e"/>
      <stop offset="1" stop-color="#143847"/>
    </linearGradient>
    <linearGradient id="ce-brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- cuadrado de aplicación: radio 18/64 ≈ 28 % del lado, como el hermano -->
  <rect width="64" height="64" rx="18" fill="url(#ce-fondo)"/>
  <rect width="64" height="64" rx="18" fill="url(#ce-brillo)"/>
  <!-- el reparto: tres tramos proporcionales, del ancho entero -->
  <rect x="10" y="23.4" width="12.6" height="11.2" rx="3.4" fill="#b04a2a"/>
  <rect x="24.6" y="23.4" width="20.2" height="11.2" rx="3.4" fill="#327a52"/>
  <rect x="46.8" y="23.4" width="7.2" height="11.2" rx="3.4" fill="#f7f1e9" opacity=".34"/>
  <!-- el tercero, todavía por correr, va en punteado: es lo previsto -->
  <rect x="46.8" y="23.4" width="7.2" height="11.2" rx="3.4" fill="none" stroke="#f7f1e9" stroke-width="1.6" stroke-dasharray="2.6 2.4"/>
  <!-- por dónde va: la marca sobre el segundo tramo -->
  <path d="M38.4 18.8v18.6" stroke="#f7f1e9" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="38.4" cy="17.4" r="3.1" fill="#e08a5f"/>
  <!-- el suelo: la línea del tiempo -->
  <path d="M10 43.4h44" stroke="#e4c5b5" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  <!-- tres pies, uno por etapa -->
  <path d="M16.3 46.6v3.6M34.7 46.6v3.6M50.4 46.6v3.6" stroke="#e4c5b5" stroke-width="2.2" stroke-linecap="round" opacity=".72"/>
</svg>
