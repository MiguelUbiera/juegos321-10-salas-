<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Carrera de equipos">
  <!-- Secuencia321 · Cronómetro Carrera de equipos · ícono de aplicación -->
  <defs>
    <linearGradient id="cr-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d677e"/>
      <stop offset="1" stop-color="#143847"/>
    </linearGradient>
    <linearGradient id="cr-brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- cuadrado de aplicación: mismo radio que el resto de la familia -->
  <rect width="64" height="64" rx="18" fill="url(#cr-fondo)"/>
  <rect width="64" height="64" rx="18" fill="url(#cr-brillo)"/>
  <!-- tres carriles con distinto avance: lo que se ve en la pista de la
       herramienta, no un cronómetro genérico -->
  <rect x="9" y="16.5" width="46" height="8.6" rx="4.3" fill="#f7f1e9" opacity=".16"/>
  <rect x="9" y="27.7" width="46" height="8.6" rx="4.3" fill="#f7f1e9" opacity=".16"/>
  <rect x="9" y="38.9" width="46" height="8.6" rx="4.3" fill="#f7f1e9" opacity=".16"/>
  <rect x="9" y="16.5" width="35.5" height="8.6" rx="4.3" fill="#e08a5f"/>
  <rect x="9" y="27.7" width="26" height="8.6" rx="4.3" fill="#327a52"/>
  <rect x="9" y="38.9" width="16.5" height="8.6" rx="4.3" fill="#8a5c78"/>
  <!-- la meta compartida: la misma marca discreta de la pantalla -->
  <path d="M46.5 12.4v39.2" stroke="#f7f1e9" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="1 4.6" opacity=".8"/>
  <circle cx="46.5" cy="12.4" r="2.6" fill="#f7f1e9"/>
</svg>
